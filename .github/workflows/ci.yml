name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target other PR branches, not just main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Tests that drive real worktrees skip themselves when wt is not installed.
  WORKTRUNK_VERSION: "0.81.0"

jobs:
  check:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install lsof
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Install Worktrunk
        run: |
          asset="worktrunk-x86_64-unknown-linux-musl.tar.xz"
          base="https://github.com/max-sixty/worktrunk/releases/download/v${WORKTRUNK_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name "$base/$asset"
          curl --fail --silent --show-error --location --remote-name "$base/$asset.sha256"
          sha256sum --check "$asset.sha256"
          mkdir worktrunk
          tar -xJf "$asset" --strip-components=1 -C worktrunk
          echo "$RUNNER_TEMP/worktrunk" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test --if-present

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webui-playwright
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  tauri:
    name: Check the Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri embeds webui/dist at compile time, so it has to exist first.
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri
