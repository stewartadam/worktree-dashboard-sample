[aliases]
service = "node {{ worktree_path }}/worktree-dashboard/worktree-service.mjs --worktree={{ worktree_path }} {{ args }}"

# Runs alone, because the steps after it read the port.
[[pre-start]]
setup-env = "node ./scripts/setup-env.mjs"

[[pre-start]]
install = "npm install"

[[post-start]]
build = "cargo build --workspace"

[pre-remove]
stop-services = "wt -C {{ worktree_path }} --yes service stop -s all --best-effort"
